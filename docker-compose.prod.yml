# Production stack: `docker compose -f docker-compose.prod.yml up -d --build`
# Standalone (not an overlay on docker-compose.yml) so there's no ambiguity about which ports/
# restart policies actually apply — see docs/setup.md#production-deployment for the full
# checklist. Flutter is never containerized; it talks to `backend` over HTTPS from outside
# Docker (put a reverse proxy/TLS terminator in front of it — not included here, see docs).
#
# Required in your .env before running this file (no insecure defaults, unlike the dev compose):
#   POSTGRES_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, AI_SERVICE_API_KEY, CORS_ORIGINS
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elderly_care}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-elderly_care}
    # No host port published — only reachable by other containers on this compose network.
    # Back up this volume regularly; see docs/setup.md#backups.
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  agentic-ai:
    build:
      context: ./agentic-ai
      dockerfile: ../docker/agentic-ai.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      INTERNAL_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set in production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-}
    # No host port published: Node reaches it as http://agentic-ai:8000 on the internal
    # network only. Flutter never talks to this service directly — see docs/architecture.md.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-elderly_care}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elderly_care}?schema=public
      # Same formula as DATABASE_URL (no pooler in front of this container). If you point
      # DATABASE_URL at an external pooler instead (e.g. Supabase), edit both lines together —
      # DIRECT_URL is used only by `prisma migrate`/`validate`, never by the running app.
      DIRECT_URL: postgresql://${POSTGRES_USER:-elderly_care}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elderly_care}?schema=public
      AI_SERVICE_URL: http://agentic-ai:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must list your real frontend origin(s) in production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in production}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      DOSE_GENERATION_DAYS_AHEAD: ${DOSE_GENERATION_DAYS_AHEAD:-2}
      MISSED_DOSE_GRACE_MINUTES: ${MISSED_DOSE_GRACE_MINUTES:-60}
      REMINDER_SWEEP_INTERVAL_MINUTES: ${REMINDER_SWEEP_INTERVAL_MINUTES:-15}
    # The only port reachable from outside this compose network — put a reverse proxy/TLS
    # terminator (nginx, Caddy, a managed load balancer, ...) in front of this in a real
    # deployment; that piece is intentionally not included here (see docs/setup.md).
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      agentic-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
